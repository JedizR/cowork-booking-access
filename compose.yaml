name: cowork-booking-access

services:
  db:
    image: postgres:16
    container_name: cowork-booking-access-db
    environment:
      POSTGRES_USER: access
      POSTGRES_PASSWORD: access
      POSTGRES_DB: access
    ports:
      - "5443:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    image: cowork-booking-access
    container_name: cowork-booking-access-app
    environment:
      APP_REVISION: compose
      DATABASE_URL: postgresql://access:access@db:5432/access
    ports:
      - "8003:8000"
    depends_on:
      - db

volumes:
  db-data:
